# HumanPay — bounded auto-pay agent (Celo Agents at Work 2026)
# Render blueprint: ONE durable web service that runs the HTTP API AND the
# Telegram long-poll bot together (see src/server.js). Because the bot keeps an
# open getUpdates long-poll, the free-tier instance never idles to sleep — the
# API + Telegram channel stay live for judges.
services:
  - type: web
    name: humanpay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: PORT
        value: 10000
      # Persist the tamper-evident receipt ledger so it survives restarts/redeploys.
      # On Render, point this at a mounted disk volume path (e.g. /var/data/humanpay.db,
      # with a Persistent Disk attached) OR set it to a standalone path if you add one.
      - key: AUDIT_DB_PATH
        value: /var/data/humanpay.db
      # --- credentials (fill in Render dashboard as secret env vars) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false                      # set the live value in Dashboard -> Environment
      - key: OP_OPERATOR_PK
        sync: false
      - key: AUDIT_SECRET
        sync: false
      # --- real x402 settlement rail (optional; SIM without) ---
      - key: X402_API_KEY
        sync: false
      - key: X402_EXECUTOR_PK
        sync: false
      - key: X402_USAT
        sync: false
      # --- real Self proof-of-human rail (optional; MOCK without) ---
      - key: SELF_AGENT_ID
        sync: false
      # --- social (OAuth) sign-in ---
      # GOOGLE_CLIENT_ID is PUBLIC (it ships in the browser redirect URL) so it's
      # safe to commit here. GOOGLE_CLIENT_SECRET must stay in the Render dashboard.
      - key: GOOGLE_CLIENT_ID
        value: 517988614557-lnfoegae15ksauft2nvgfgok5d36gshs.apps.googleusercontent.com
      - key: GOOGLE_CLIENT_SECRET
        sync: false                      # set in Dashboard -> Environment (REQUIRED for the token exchange)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # --- FX corridors (optional; labelled estimate without) ---
      - key: TEXTILE_FX_URL
        sync: false
      # --- auth sessions ---
      - key: AUTH_SECRET
        sync: false